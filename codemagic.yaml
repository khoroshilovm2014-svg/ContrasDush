workflows:
  ios-workflow:
    name: ContrasDush iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.khoroshilovm.contrasdush
      vars:
        XCODE_WORKSPACE: "ContrasDush.xcworkspace"
        XCODE_SCHEME: "ContrasDush"
    scripts:
      - name: Install dependencies
        script: |
          echo "No dependencies to install"
      
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.khoroshilovm.contrasdush" --type IOS_APP_DEVELOPMENT --create
          keychain add-certificates
          xcode-project use-profiles
      
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "ContrasDush.xcodeproj" \
            --scheme "ContrasDush"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - khoroshilovm2014@gmail.com
        notify:
          success: true
          failure: true