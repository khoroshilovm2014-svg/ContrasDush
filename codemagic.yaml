workflows:
  ios-workflow:
    name: ContrasDush iOS Build (unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Install xcodegen
        script: |
          brew install xcodegen
      
      - name: Generate Xcode project
        script: |
          xcodegen generate
      
      - name: Build app (unsigned)
        script: |
          xcodebuild \
            -project ContrasDush.xcodeproj \
            -scheme ContrasDush \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            build
      
      - name: Package to IPA
        script: |
          mkdir -p artifacts/Payload
          cp -R build/Build/Products/Release-iphoneos/ContrasDush.app artifacts/Payload/
          cd artifacts
          zip -r ContrasDush-unsigned.ipa Payload
    artifacts:
      - artifacts/ContrasDush-unsigned.ipa