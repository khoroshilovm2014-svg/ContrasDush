name: ContrasDush
options:
  bundleIdPrefix: com.khoroshilovm
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  ContrasDush:
    type: application
    platform: iOS
    sources:
      - path: ContrasDush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khoroshilovm.contrasdush
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Контраст"
        INFOPLIST_KEY_CFBundleIconName: "AppIcon"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"